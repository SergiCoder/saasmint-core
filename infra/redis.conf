# Dev-only Redis configuration for the local docker-compose stack.
#
# Passing an explicit config file path (redis-server /usr/local/etc/redis/redis.conf)
# is what silences Redis's "no config file specified, using the default config"
# startup warning — command-line flags alone do not. The settings below suit a
# disposable dev Celery broker / result backend.

# Disable RDB snapshots: dev broker/result data is ephemeral, and skipping the
# fork-based bgsave also sidesteps the memory-overcommit warning's actual
# failure mode (a save fork that can't reserve memory).
save ""

# No AOF persistence in dev either.
appendonly no

# Celery uses Redis as broker + result backend; never evict task payloads.
maxmemory-policy noeviction
